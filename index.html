<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chevalier des Multiplications 🛡️</title>
<style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        touch-action: manipulation;
    }
    body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background: linear-gradient(160deg, #1b2a4a 0%, #3a1c5c 45%, #5c1c3c 100%);
        min-height: 100vh;
        padding: 12px;
        text-align: center;
        color: white;
        position: relative;
    }
    #game {
        max-width: 500px;
        margin: 0 auto;
        background: rgba(0,0,0,0.35);
        border-radius: 24px;
        padding: 16px;
        border: 2px solid rgba(255,255,255,0.15);
        box-shadow: 0 0 40px rgba(255,215,0,0.15);
        transition: transform 0.05s;
        position: relative;
        overflow: hidden;
    }
    #game.shake { animation: shakeAnim 0.35s; }
    @keyframes shakeAnim {
        0%, 100% { transform: translate(0,0); }
        20% { transform: translate(-10px, 4px); }
        40% { transform: translate(10px, -4px); }
        60% { transform: translate(-8px, 3px); }
        80% { transform: translate(8px, -3px); }
    }
    h1 { font-size: clamp(20px, 6vw, 28px); margin: 6px 0; text-shadow: 0 0 12px gold; }

    .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 15px;
        margin-bottom: 6px;
        padding: 0 4px;
    }
    .coins { color: gold; font-weight: bold; }
    .progress { font-weight: bold; }

    .combo-banner {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%) scale(0);
        font-size: 22px;
        font-weight: 900;
        color: #FFD700;
        text-shadow: 0 0 10px orange, 2px 2px 0 #000;
        z-index: 30;
        pointer-events: none;
        white-space: nowrap;
    }
    .combo-banner.show { animation: comboPop 0.9s ease-out; }
    @keyframes comboPop {
        0% { transform: translateX(-50%) scale(0) rotate(-8deg); opacity: 0; }
        20% { transform: translateX(-50%) scale(1.3) rotate(4deg); opacity: 1; }
        35% { transform: translateX(-50%) scale(1) rotate(0deg); }
        80% { transform: translateX(-50%) scale(1) rotate(0deg); opacity: 1; }
        100% { transform: translateX(-50%) scale(0.8) translateY(-20px); opacity: 0; }
    }

    .arena {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 10px 0 16px;
        height: clamp(110px, 28vw, 160px);
        position: relative;
    }
    .fighter-wrap { position: relative; width: 45%; }
    .fighter {
        font-size: clamp(55px, 16vw, 90px);
        transition: transform 0.15s;
        display: inline-block;
    }
    .knight { transform: scaleX(1); }
    .enemy { transform: scaleX(-1); }
    .attack.knight { animation: attackKnight 0.35s; }
    .attack.enemy { animation: attackEnemy 0.35s; }
    .hit { animation: hitFlash 0.35s; }
    @keyframes attackKnight {
        0% { transform: translateX(0) scaleX(1); }
        50% { transform: translateX(35px) scaleX(1); }
        100% { transform: translateX(0) scaleX(1); }
    }
    @keyframes attackEnemy {
        0% { transform: translateX(0) scaleX(-1); }
        50% { transform: translateX(-35px) scaleX(-1); }
        100% { transform: translateX(0) scaleX(-1); }
    }
    @keyframes hitFlash {
        0%, 100% { filter: brightness(1) drop-shadow(0 0 0 red); }
        50% { filter: brightness(2) drop-shadow(0 0 12px red) saturate(3); }
    }
    .fighter.ko { animation: koFall 0.6s forwards; }
    @keyframes koFall {
        to { transform: rotate(80deg) translateY(20px); opacity: 0.3; }
    }

    .health-bar {
        width: 90%;
        max-width: 160px;
        height: 18px;
        background: #222;
        border: 2px solid white;
        border-radius: 10px;
        overflow: hidden;
        margin: 6px auto;
        position: relative;
    }
    .health {
        height: 100%;
        background: linear-gradient(90deg, #7CFC00, #32CD32);
        transition: width 0.35s ease-out;
    }
    .health.low { background: linear-gradient(90deg, #ff5555, #cc0000); }
    .fighter-wrap p { margin: 2px 0; font-size: 13px; font-weight: bold; opacity: 0.9; }

    .dmg-float {
        position: absolute;
        top: 20%;
        left: 50%;
        font-size: 22px;
        font-weight: 900;
        pointer-events: none;
        z-index: 20;
        animation: floatUp 0.9s ease-out forwards;
    }
    @keyframes floatUp {
        0% { transform: translate(-50%, 0) scale(0.6); opacity: 0; }
        20% { transform: translate(-50%, -10px) scale(1.3); opacity: 1; }
        100% { transform: translate(-50%, -60px) scale(1); opacity: 0; }
    }

    .question {
        font-size: clamp(24px, 7vw, 32px);
        margin: 10px 0;
        min-height: 44px;
        font-weight: bold;
        text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }
    #message {
        font-size: 19px;
        min-height: 28px;
        margin: 6px 0;
        font-weight: bold;
    }
    .answers {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
        max-width: 420px;
        margin: 16px auto 8px;
    }
    button {
        padding: 18px 6px;
        font-size: clamp(22px, 6vw, 28px);
        background: linear-gradient(180deg, #FFE066, #FFB700);
        color: #3a2400;
        border: none;
        border-bottom: 5px solid #b57d00;
        border-radius: 16px;
        cursor: pointer;
        font-weight: 900;
        transition: transform 0.1s, filter 0.1s;
        touch-action: manipulation;
    }
    button:active { transform: scale(0.93) translateY(2px); border-bottom-width: 2px; filter: brightness(0.95); }
    button.correct-flash { background: linear-gradient(180deg,#9CFF6B,#4CD137) !important; }
    button.wrong-flash { background: linear-gradient(180deg,#ff8a8a,#e84118) !important; color: white; }
    button:disabled { opacity: 0.55; }

    #nextBtn {
        margin-top: 10px;
        background: linear-gradient(180deg,#6be0ff,#1e90ff);
        border-bottom-color: #0b5a94;
        color: white;
        display: none;
        width: 90%;
        max-width: 300px;
        font-size: 20px;
        padding: 14px;
    }

    /* Particles */
    .particle {
        position: fixed;
        pointer-events: none;
        z-index: 999;
        font-size: 20px;
    }
    @keyframes burstOut {
        to { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)) scale(0); opacity: 0; }
    }

    /* Confetti */
    .confetti-piece {
        position: fixed;
        top: -20px;
        width: 10px;
        height: 16px;
        z-index: 998;
        pointer-events: none;
        animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
        to { transform: translateY(110vh) rotate(720deg); opacity: 0.7; }
    }

    /* Overlays */
    .overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s;
    }
    .overlay.show { opacity: 1; pointer-events: auto; }

    .victory-overlay { background: radial-gradient(circle, rgba(255,215,0,0.35), rgba(0,0,0,0.75)); }
    .victory-card {
        background: linear-gradient(160deg,#2b1055,#5c1c8c);
        border: 3px solid gold;
        border-radius: 24px;
        padding: 28px 22px;
        max-width: 320px;
        box-shadow: 0 0 60px gold;
        transform: scale(0.5);
        transition: transform 0.4s cubic-bezier(.17,.89,.32,1.49);
    }
    .overlay.show .victory-card { transform: scale(1); }
    .victory-card h2 { font-size: 26px; color: gold; text-shadow: 0 0 10px orange; margin: 0 0 8px; }
    .stars { font-size: 40px; margin: 10px 0; letter-spacing: 4px; }
    .stars span { display: inline-block; opacity: 0.25; transform: scale(0.5); transition: all 0.35s; }
    .stars span.lit { opacity: 1; transform: scale(1); text-shadow: 0 0 14px gold; }
    .reward-line { font-size: 18px; margin: 8px 0; color: #FFE066; font-weight: bold; }

    .defeat-overlay { background: radial-gradient(circle, rgba(120,0,0,0.55), rgba(0,0,0,0.9)); }
    .defeat-card {
        border: 3px solid #ff3b3b;
        border-radius: 24px;
        padding: 28px 22px;
        max-width: 320px;
        background: #1a0000;
        box-shadow: 0 0 50px red;
        transform: scale(0.6) rotate(-3deg);
        transition: transform 0.4s cubic-bezier(.17,.89,.32,1.49);
    }
    .overlay.show .defeat-card { transform: scale(1) rotate(0deg); }
    .defeat-card h2 {
        font-size: 30px; color: #ff3b3b; margin: 0 0 10px;
        text-shadow: 0 0 14px red;
        animation: shudder 0.5s infinite;
    }
    @keyframes shudder {
        0%,100% { transform: translateX(0); }
        25% { transform: translateX(-3px); }
        75% { transform: translateX(3px); }
    }
    .defeat-card p { font-size: 15px; opacity: 0.85; margin: 6px 0 16px; }

    .big-btn {
        padding: 14px 26px;
        font-size: 19px;
        border-radius: 14px;
        border: none;
        font-weight: 900;
        cursor: pointer;
        border-bottom: 4px solid;
    }
    .btn-gold { background: linear-gradient(180deg,#FFE066,#FFB700); color:#3a2400; border-bottom-color:#b57d00; }
    .btn-red { background: linear-gradient(180deg,#ff8a8a,#e84118); color:white; border-bottom-color:#8a1a0a; }

    .vignette-flash {
        position: fixed; inset: 0; pointer-events: none; z-index: 500;
        opacity: 0;
    }
    .vignette-flash.flash { animation: vflash 0.35s; }
    @keyframes vflash {
        0% { opacity: 0.85; }
        100% { opacity: 0; }
    }
</style>
</head>
<body>

<div class="vignette-flash" id="vignette"></div>

<div id="game">
    <div class="combo-banner" id="comboBanner"></div>
    <h1>🛡️ Chevalier des Multiplications 🐉</h1>

    <div class="topbar">
        <div class="progress">Niveau <span id="level">1</span>/5</div>
        <div class="coins">🪙 <span id="coins">0</span></div>
    </div>

    <div class="arena">
        <div class="fighter-wrap">
            <div id="knight" class="fighter knight">🧙‍♂️</div>
            <div class="health-bar"><div id="knightHealth" class="health" style="width:100%"></div></div>
            <p>Chevalier</p>
        </div>

        <div class="fighter-wrap">
            <div id="enemy" class="fighter enemy">👹</div>
            <div class="health-bar"><div id="enemyHealth" class="health" style="width:100%"></div></div>
            <p id="enemyName">Gobelin</p>
        </div>
    </div>

    <div class="question" id="question">Combien fait 6 × 7 ?</div>
    <div id="message"></div>

    <div class="answers" id="answers"></div>

    <button id="nextBtn" class="big-btn" onclick="nextEnemy()">⚔️ Ennemi suivant</button>
</div>

<!-- Victory overlay -->
<div class="overlay victory-overlay" id="victoryOverlay">
    <div class="victory-card">
        <h2 id="victoryTitle">🎉 VAINCU !</h2>
        <div class="stars" id="starsRow">
            <span>★</span><span>★</span><span>★</span>
        </div>
        <div class="reward-line" id="rewardLine">+30 🪙</div>
        <button class="big-btn btn-gold" onclick="closeVictory()">Continuer ➜</button>
    </div>
</div>

<!-- Defeat overlay -->
<div class="overlay defeat-overlay" id="defeatOverlay">
    <div class="defeat-card">
        <h2>💀 GAME OVER</h2>
        <p id="defeatText">Le monstre t'a eu... Tous tes points de combo sont perdus !</p>
        <button class="big-btn btn-red" onclick="restartAfterDefeat()">🔁 Réessayer</button>
    </div>
</div>

<!-- Final victory overlay -->
<div class="overlay victory-overlay" id="finalOverlay">
    <div class="victory-card">
        <h2>🏆 TU ES UN VRAI CHEVALIER !</h2>
        <div class="reward-line">Le Dragon est vaincu !</div>
        <div class="reward-line" id="finalCoins">🪙 Total : 0</div>
        <button class="big-btn btn-gold" onclick="restartFromZero()">Rejouer depuis le début</button>
    </div>
</div>

<script>
// ============== DONNÉES ==============
const enemies = [
    {name: "Gobelin", emoji: "👹", table: [2,3,4]},
    {name: "Orc", emoji: "🧌", table: [5,6]},
    {name: "Troll", emoji: "👺", table: [7,8]},
    {name: "Sorcier", emoji: "🧙", table: [9]},
    {name: "Dragon", emoji: "🐉", table: [10]}
];

let currentEnemyIndex = 0;
let knightHP = 100;
let enemyHP = 100;
let currentQuestion = {a:0, b:0, answer:0};
let combo = 0;
let bestComboThisFight = 0;
let coins = 0;
let mistakesThisFight = 0;
let answering = false;

const comboMessages = ["Bien joué !", "Super !", "Excellent !", "INCROYABLE !", "LÉGENDAIRE !", "IMPARABLE !!"];

// ============== SON (Web Audio, aucun fichier nécessaire) ==============
let audioCtx = null;
function ensureAudio() {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
}

function beep(freq, duration, type='sine', vol=0.25, delay=0) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = vol;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const t = audioCtx.currentTime + delay;
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.start(t);
    osc.stop(t + duration);
}

function sfx(type) {
    ensureAudio();
    if (!audioCtx) return;
    if (type === 'correct') {
        beep(523, 0.1, 'triangle', 0.25);
        beep(784, 0.15, 'triangle', 0.25, 0.08);
    } else if (type === 'wrong') {
        beep(180, 0.25, 'sawtooth', 0.2);
        beep(120, 0.3, 'sawtooth', 0.2, 0.1);
    } else if (type === 'combo') {
        beep(660, 0.08, 'square', 0.2);
        beep(880, 0.08, 'square', 0.2, 0.07);
        beep(1100, 0.12, 'square', 0.22, 0.14);
    } else if (type === 'victory') {
        [523,659,784,1046].forEach((f,i) => beep(f, 0.22, 'triangle', 0.28, i*0.1));
    } else if (type === 'defeat') {
        [400,350,300,220].forEach((f,i) => beep(f, 0.3, 'sawtooth', 0.22, i*0.15));
    } else if (type === 'coin') {
        beep(988, 0.05, 'square', 0.15);
        beep(1319, 0.1, 'square', 0.15, 0.05);
    }
}

function vibrate(pattern) {
    if (navigator.vibrate) navigator.vibrate(pattern);
}

// ============== EFFETS VISUELS ==============
function shakeScreen(intensity='normal') {
    const g = document.getElementById('game');
    g.classList.remove('shake');
    void g.offsetWidth;
    g.classList.add('shake');
    setTimeout(() => g.classList.remove('shake'), 350);
}

function flashVignette() {
    const v = document.getElementById('vignette');
    v.style.background = 'radial-gradient(circle, transparent 40%, rgba(255,0,0,0.6) 100%)';
    v.classList.remove('flash');
    void v.offsetWidth;
    v.classList.add('flash');
}

function showDamageNumber(elId, text, color) {
    const wrap = document.getElementById(elId).parentElement;
    const d = document.createElement('div');
    d.className = 'dmg-float';
    d.textContent = text;
    d.style.color = color;
    wrap.style.position = 'relative';
    wrap.appendChild(d);
    setTimeout(() => d.remove(), 900);
}

function spawnParticles(originEl, emojiList, count) {
    const rect = originEl.getBoundingClientRect();
    for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.textContent = emojiList[Math.floor(Math.random()*emojiList.length)];
        const startX = rect.left + rect.width/2;
        const startY = rect.top + rect.height/2;
        p.style.left = startX + 'px';
        p.style.top = startY + 'px';
        const angle = Math.random() * Math.PI * 2;
        const dist = 60 + Math.random()*80;
        const dx = Math.cos(angle) * dist;
        const dy = Math.sin(angle) * dist - 30;
        p.style.setProperty('--dx', dx + 'px');
        p.style.setProperty('--dy', dy + 'px');
        p.style.setProperty('--rot', (Math.random()*360) + 'deg');
        p.style.animation = 'burstOut 0.8s ease-out forwards';
        document.body.appendChild(p);
        setTimeout(() => p.remove(), 850);
    }
}

function launchConfetti(count) {
    const colors = ['#FFD700','#FF6B6B','#4ECDC4','#95E1D3','#C589E8','#6BCB77','#FF9F45'];
    for (let i = 0; i < count; i++) {
        const c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.left = Math.random()*100 + 'vw';
        c.style.background = colors[Math.floor(Math.random()*colors.length)];
        c.style.animationDuration = (2 + Math.random()*1.5) + 's';
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
    }
}

function showCombo(n) {
    if (n < 2) return;
    const banner = document.getElementById('comboBanner');
    const msgIdx = Math.min(n - 2, comboMessages.length - 1);
    banner.textContent = `🔥 COMBO x${n} — ${comboMessages[msgIdx]}`;
    banner.classList.remove('show');
    void banner.offsetWidth;
    banner.classList.add('show');
    sfx('combo');
}

function addCoins(n) {
    coins += n;
    document.getElementById('coins').textContent = coins;
    sfx('coin');
}

function updateHealthBar(id, hp) {
    const bar = document.getElementById(id);
    bar.style.width = hp + '%';
    if (hp <= 30) bar.classList.add('low'); else bar.classList.remove('low');
}

// ============== LOGIQUE DE JEU ==============
function generateQuestion() {
    const enemy = enemies[currentEnemyIndex];
    const table = enemy.table[Math.floor(Math.random()*enemy.table.length)];
    const a = table;
    const b = Math.floor(Math.random()*10) + 1;
    currentQuestion = {a, b, answer: a*b};

    document.getElementById('question').textContent = `Combien fait ${a} × ${b} ?`;
    document.getElementById('enemyName').textContent = enemy.name;
    document.getElementById('enemy').textContent = enemy.emoji;
    document.getElementById('message').textContent = '';
    answering = false;
}

function createAnswers() {
    const answersDiv = document.getElementById('answers');
    answersDiv.innerHTML = '';

    const correct = currentQuestion.answer;
    let options = [correct];

    while (options.length < 4) {
        const wrong = Math.floor(Math.random()*81) + 2;
        if (!options.includes(wrong)) options.push(wrong);
    }

    options.sort(() => Math.random() - 0.5);

    options.forEach(opt => {
        const btn = document.createElement('button');
        btn.textContent = opt;
        btn.onclick = () => checkAnswer(opt, btn);
        answersDiv.appendChild(btn);
    });
}

function checkAnswer(selected, btnEl) {
    if (answering) return;
    answering = true;
    ensureAudio();

    const msg = document.getElementById('message');
    const knight = document.getElementById('knight');
    const enemyEl = document.getElementById('enemy');
    const allBtns = document.querySelectorAll('#answers button');
    allBtns.forEach(b => b.disabled = true);

    if (selected === currentQuestion.answer) {
        // BONNE RÉPONSE
        combo++;
        bestComboThisFight = Math.max(bestComboThisFight, combo);
        btnEl.classList.add('correct-flash');
        sfx('correct');
        vibrate(20);
        showCombo(combo);

        msg.style.color = '#7CFF6B';
        msg.textContent = "✅ Coup d'épée !";
        knight.classList.add('attack', 'knight');

        const dmg = 20 + Math.min(combo, 4) * 5; // 25 -> jusqu'à 40 avec combo
        enemyHP = Math.max(0, enemyHP - dmg);
        updateHealthBar('enemyHealth', enemyHP);
        showDamageNumber('enemy', '-' + dmg, '#FF5555');
        spawnParticles(enemyEl, ['💥','⭐','✨'], 8 + combo*2);
        addCoins(2 + combo);

        setTimeout(() => knight.classList.remove('attack'), 350);

        if (enemyHP <= 0) {
            enemyEl.classList.add('ko');
            setTimeout(() => triggerVictory(), 400);
            return;
        }
    } else {
        // MAUVAISE RÉPONSE
        combo = 0;
        btnEl.classList.add('wrong-flash');
        // révèle la bonne réponse
        allBtns.forEach(b => { if (parseInt(b.textContent) === currentQuestion.answer) b.classList.add('correct-flash'); });
        sfx('wrong');
        vibrate([40,30,40]);

        msg.style.color = '#ff6b6b';
        msg.textContent = "❌ Le monstre attaque !";
        enemyEl.classList.add('attack');

        knightHP = Math.max(0, knightHP - 20);
        updateHealthBar('knightHealth', knightHP);
        showDamageNumber('knight', '-20', '#FF3333');
        shakeScreen();
        flashVignette();
        mistakesThisFight++;

        setTimeout(() => enemyEl.classList.remove('attack'), 350);

        if (knightHP <= 0) {
            document.getElementById('knight').classList.add('ko');
            setTimeout(() => triggerDefeat(), 500);
            return;
        }
    }

    setTimeout(() => {
        generateQuestion();
        createAnswers();
    }, 1100);
}

function triggerVictory() {
    sfx('victory');
    vibrate([30,50,30,50,80]);
    launchConfetti(currentEnemyIndex === enemies.length - 1 ? 0 : 40);

    const enemy = enemies[currentEnemyIndex];
    document.getElementById('victoryTitle').textContent = `🎉 ${enemy.name} vaincu !`;

    // étoiles selon la précision du combat
    let starCount = 3;
    if (mistakesThisFight >= 1) starCount = 2;
    if (mistakesThisFight >= 3) starCount = 1;
    const starsEls = document.querySelectorAll('#starsRow span');
    starsEls.forEach((s, i) => s.classList.remove('lit'));
    starsEls.forEach((s, i) => {
        setTimeout(() => { if (i < starCount) { s.classList.add('lit'); sfx('coin'); } }, 300 + i*250);
    });

    const bonus = 20 + bestComboThisFight * 5;
    document.getElementById('rewardLine').textContent = `+${bonus} 🪙  (combo max x${bestComboThisFight})`;
    addCoins(bonus);

    document.getElementById('victoryOverlay').classList.add('show');
}

function closeVictory() {
    document.getElementById('victoryOverlay').classList.remove('show');
    mistakesThisFight = 0;
    bestComboThisFight = 0;
    combo = 0;

    if (currentEnemyIndex >= enemies.length - 1) {
        // dernier ennemi battu -> victoire finale
        setTimeout(() => {
            launchConfetti(120);
            sfx('victory');
            vibrate([50,60,50,60,50,60,150]);
            document.getElementById('finalCoins').textContent = `🪙 Total : ${coins}`;
            document.getElementById('finalOverlay').classList.add('show');
        }, 150);
        return;
    }

    currentEnemyIndex++;
    document.getElementById('level').textContent = currentEnemyIndex + 1;
    enemyHP = 100;
    document.getElementById('enemy').classList.remove('ko');
    document.getElementById('knight').classList.remove('ko');
    updateHealthBar('enemyHealth', 100);
    generateQuestion();
    createAnswers();
}

function nextEnemy() {
    closeVictory();
}

function triggerDefeat() {
    sfx('defeat');
    vibrate([100,50,100,50,200]);
    shakeScreen();
    document.getElementById('defeatOverlay').classList.add('show');
}

function restartAfterDefeat() {
    document.getElementById('defeatOverlay').classList.remove('show');
    // Le combat contre l'ennemi ACTUEL recommence (pas de retour au niveau 1) -> moins puni, mais reste stimulant
    knightHP = 100;
    enemyHP = 100;
    combo = 0;
    mistakesThisFight = 0;
    document.getElementById('knight').classList.remove('ko');
    document.getElementById('enemy').classList.remove('ko');
    updateHealthBar('knightHealth', 100);
    updateHealthBar('enemyHealth', 100);
    generateQuestion();
    createAnswers();
}

function restartFromZero() {
    document.getElementById('finalOverlay').classList.remove('show');
    currentEnemyIndex = 0;
    knightHP = 100;
    enemyHP = 100;
    combo = 0;
    coins = 0;
    document.getElementById('coins').textContent = 0;
    document.getElementById('level').textContent = 1;
    document.getElementById('knight').classList.remove('ko');
    document.getElementById('enemy').classList.remove('ko');
    updateHealthBar('knightHealth', 100);
    updateHealthBar('enemyHealth', 100);
    generateQuestion();
    createAnswers();
}

// Démarrage
document.body.addEventListener('touchstart', ensureAudio, {once:true});
document.body.addEventListener('click', ensureAudio, {once:true});
generateQuestion();
createAnswers();
</script>
</body>
</html>
